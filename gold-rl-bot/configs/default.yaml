data:
  source: synthetic        # "synthetic" or "real" (real requires goldbot/data/loader.py + internet)
  n_bars: 8000              # only used for synthetic
  interval: 1h
  period: 730d               # only used for real (yfinance period string)

features:
  higher_timeframes: ["4h", "1D"]

env:
  window_size: 24
  cost_bps: 2.0             # round-trip-ish spread/commission cost in bps of notional

training:
  total_timesteps: 50000
  seed: 0

walk_forward:
  train_size: 3000
  test_size: 750
  step: 750

stress_tests:
  monte_carlo_sims: 2000
  n_random_policies: 200
  seeds: [0, 1, 2, 3, 4]

bars_per_year: 8760          # 24 * 365, for hourly data; adjust if interval changes
